<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docu AI</title>
<style>
  :root {
    --bg: #f6f7fb; --panel: #ffffff; --text: #1c2030; --muted: #6b7185; --border: #e3e6ef;
    --accent: #4f46e5; --accent-soft: #eef0ff; --user: #4f46e5; --assistant: #f0f2f8;
    --ok: #15803d; --ok-bg: #dcfce7; --warn: #a16207; --warn-bg: #fef3c7;
    --bad: #b91c1c; --bad-bg: #fee2e2; --shadow: 0 1px 3px rgba(20, 24, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11131a; --panel: #1a1d27; --text: #e8eaf2; --muted: #9096ab; --border: #2a2e3c;
      --accent: #818cf8; --accent-soft: #252a45; --user: #4f46e5; --assistant: #232736;
      --ok: #86efac; --ok-bg: #14341f; --warn: #fcd34d; --warn-bg: #3a2f0e;
      --bad: #fca5a5; --bad-bg: #3d1717; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }

  /* ---------- Sidebar ---------- */
  aside { background: var(--panel); border-right: 1px solid var(--border); display: flex;
          flex-direction: column; min-height: 0; }
  .brand { padding: 18px 20px 8px; font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
  .brand span { color: var(--accent); }
  .dropzone { margin: 8px 16px 12px; padding: 18px 12px; border: 2px dashed var(--border);
              border-radius: 12px; text-align: center; color: var(--muted); cursor: pointer;
              transition: .15s; }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-soft);
                                    color: var(--accent); }
  .dropzone strong { display: block; color: var(--text); font-weight: 600; }
  .dropzone small { font-size: 12px; }
  .list-head { display: flex; justify-content: space-between; align-items: center;
               padding: 4px 20px 6px; color: var(--muted); font-size: 12px;
               text-transform: uppercase; letter-spacing: .6px; }
  .docs { flex: 1; overflow-y: auto; padding: 0 12px 8px; min-height: 0; }
  .doc { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: start;
         padding: 10px; border: 1px solid transparent; border-radius: 10px; }
  .doc:hover { background: var(--bg); }
  .doc.selected { background: var(--accent-soft); border-color: var(--accent); }
  .doc input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; }
  .doc input:disabled { cursor: not-allowed; opacity: .4; }
  .doc-name { font-weight: 600; word-break: break-word; }
  .doc-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 3px;
              color: var(--muted); font-size: 12px; }
  .doc-error { margin-top: 4px; color: var(--bad); font-size: 12px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .tag { background: var(--bg); border: 1px solid var(--border); border-radius: 999px;
         padding: 0 8px; font-size: 11px; color: var(--muted); }
  .badge { border-radius: 999px; padding: 0 8px; font-size: 11px; font-weight: 600; }
  .badge.ready { background: var(--ok-bg); color: var(--ok); }
  .badge.pending, .badge.processing { background: var(--warn-bg); color: var(--warn); }
  .badge.failed { background: var(--bad-bg); color: var(--bad); }
  .spinner { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
             border: 2px solid currentColor; border-right-color: transparent;
             animation: spin .8s linear infinite; vertical-align: -1px; margin-right: 4px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .doc-actions { display: flex; gap: 2px; }
  .icon-btn { background: none; border: none; border-radius: 6px; padding: 2px 6px;
              color: var(--muted); font-size: 15px; }
  .icon-btn:hover { background: var(--border); color: var(--text); }
  .empty-list { padding: 24px 12px; text-align: center; color: var(--muted); }
  .side-foot { padding: 12px 16px; border-top: 1px solid var(--border); }
  .btn { width: 100%; padding: 10px 14px; border-radius: 10px; border: none; font-weight: 600;
         background: var(--accent); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border);
                   width: auto; padding: 6px 12px; font-weight: 500; }

  /* ---------- Chat ---------- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 14px 24px;
            background: var(--panel); border-bottom: 1px solid var(--border); min-height: 57px; }
  .topbar .title { font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
  .chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px;
          padding: 2px 10px; font-size: 12px; font-weight: 500; }
  .messages { flex: 1; overflow-y: auto; padding: 24px; min-height: 0; scroll-behavior: smooth; }
  .thread { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .placeholder { margin: auto; max-width: 420px; text-align: center; color: var(--muted);
                 padding-top: 12vh; }
  .placeholder h2 { color: var(--text); margin: 8px 0; }
  .placeholder .big { font-size: 42px; }
  .msg { display: flex; flex-direction: column; max-width: 88%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .bubble { padding: 10px 14px; border-radius: 16px; box-shadow: var(--shadow); }
  .user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 4px;
                  white-space: pre-wrap; word-break: break-word; }
  .assistant .bubble { background: var(--assistant); border-bottom-left-radius: 4px; }
  .assistant .bubble p { margin: 0 0 8px; } .assistant .bubble p:last-child { margin: 0; }
  .assistant .bubble ul { margin: 0 0 8px; padding-left: 20px; }
  .assistant .bubble.error { background: var(--bad-bg); color: var(--bad); }
  .cite { background: var(--accent); color: #fff; border: none; border-radius: 6px;
          min-width: 18px; height: 18px; font-size: 11px; font-weight: 700; padding: 0 5px;
          margin: 0 1px; line-height: 18px; vertical-align: 1px; }
  .sources { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .sources-title { font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
                   color: var(--muted); }
  .source { border: 1px solid var(--border); background: var(--panel); border-radius: 10px;
            font-size: 12px; overflow: hidden; }
  .source.flash { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .source-head { display: flex; gap: 8px; align-items: center; width: 100%; background: none;
                 border: none; padding: 6px 10px; text-align: left; }
  .source-head .n { background: var(--accent); color: #fff; border-radius: 5px; padding: 0 6px;
                    font-weight: 700; }
  .source-head .file { font-weight: 600; flex: 1; min-width: 0; overflow: hidden;
                       text-overflow: ellipsis; white-space: nowrap; }
  .source-head .pg { color: var(--muted); }
  .source-body { display: none; padding: 0 10px 8px; color: var(--muted); }
  .source.open .source-body { display: block; }
  .msg-meta { margin-top: 4px; font-size: 11px; color: var(--muted); }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
              animation: blink 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .composer { padding: 14px 24px 20px; background: var(--bg); }
  .composer-inner { max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
                    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
                    padding: 8px 8px 8px 14px; box-shadow: var(--shadow); }
  .composer-inner:focus-within { border-color: var(--accent); }
  textarea { flex: 1; border: none; outline: none; resize: none; background: transparent;
             color: var(--text); font: inherit; max-height: 140px; padding: 6px 0; }
  .send { width: auto; padding: 8px 16px; }

  /* ---------- Insights dialog + toasts ---------- */
  dialog { border: none; border-radius: 16px; padding: 0; max-width: 560px; width: 92vw;
           background: var(--panel); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  dialog::backdrop { background: rgba(10, 12, 20, .5); }
  .dlg { padding: 22px 24px; max-height: 80vh; overflow-y: auto; }
  .dlg h3 { margin: 0 0 4px; } .dlg h4 { margin: 16px 0 6px; font-size: 12px; color: var(--muted);
            text-transform: uppercase; letter-spacing: .6px; }
  .dlg ul { margin: 0; padding-left: 20px; }
  .dlg-foot { display: flex; justify-content: flex-end; margin-top: 18px; }
  #toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column;
            gap: 8px; z-index: 10; }
  .toast { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px;
           box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 340px; }
  .toast.error { background: var(--bad); color: #fff; }

  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 46% 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Docu <span>AI</span></div>
    <label class="dropzone" id="dropzone">
      <strong>Drop files or click to upload</strong>
      <small>PDF, DOCX, TXT, MD &middot; up to 20 MB</small>
      <input type="file" id="fileInput" multiple hidden accept=".pdf,.docx,.txt,.md">
    </label>
    <div class="list-head"><span>Documents</span><span id="docCount"></span></div>
    <div class="docs" id="docs"></div>
    <div class="side-foot">
      <button class="btn" id="startChat" disabled>Select documents to chat</button>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div class="chips" id="chips"><span class="title">Chat</span></div>
      <button class="btn secondary" id="newChat" hidden>New chat</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="Start a chat to ask questions" disabled></textarea>
        <button class="btn send" id="send" disabled>Send</button>
      </div>
    </div>
  </main>
</div>

<dialog id="insightsDialog"><div class="dlg" id="insightsBody"></div></dialog>
<div id="toasts"></div>

<script>
"use strict";
const SESSION_KEY = "docuai.session";
const state = { docs: [], selected: new Set(), session: null, busy: false, pollTimer: null };
const $ = (id) => document.getElementById(id);

/* ---------- helpers ---------- */
function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c != null) el.append(c);
  return el;
}

function toast(message, isError = false) {
  const el = h("div", { class: "toast" + (isError ? " error" : "") }, message);
  $("toasts").append(el);
  setTimeout(() => el.remove(), isError ? 6000 : 3000);
}

async function api(path, options = {}) {
  let response;
  try {
    response = await fetch(path, options);
  } catch {
    throw new Error("Cannot reach the server. Is it running?");
  }
  if (response.status === 204) return null;
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    const detail = Array.isArray(body.detail) ? body.detail.map((d) => d.msg).join("; ") : body.detail;
    throw new Error(detail || `Request failed (${response.status})`);
  }
  return body;
}

const formatSize = (bytes) => bytes < 1024 * 1024 ? `${Math.max(1, Math.round(bytes / 1024))} KB`
                                                  : `${(bytes / 1024 / 1024).toFixed(1)} MB`;
const isWorking = (d) => d.status === "pending" || d.status === "processing";

/* ---------- documents ---------- */
async function loadDocs() {
  try {
    const data = await api("/documents?limit=100");
    state.docs = data.items;
    // Drop selections of documents that disappeared or are no longer ready.
    for (const id of [...state.selected]) {
      const doc = state.docs.find((d) => d.id === id);
      if (!doc || doc.status !== "ready") state.selected.delete(id);
    }
    renderDocs();
  } catch (e) { toast(e.message, true); }
  schedulePoll();
}

function schedulePoll() {
  clearTimeout(state.pollTimer);
  if (state.docs.some(isWorking)) state.pollTimer = setTimeout(loadDocs, 2000);
}

function renderDocs() {
  const box = $("docs");
  box.replaceChildren();
  $("docCount").textContent = state.docs.length ? String(state.docs.length) : "";
  if (!state.docs.length) {
    box.append(h("div", { class: "empty-list" }, "No documents yet. Upload one to get started."));
  }
  for (const doc of state.docs) box.append(docRow(doc));
  updateStartButton();
}

function statusBadge(doc) {
  const label = isWorking(doc) ? [h("span", { class: "spinner" }), doc.status] : doc.status;
  return h("span", { class: `badge ${doc.status}` }, label);
}

function docRow(doc) {
  const ready = doc.status === "ready";
  const checkbox = h("input", { type: "checkbox", disabled: !ready,
    title: ready ? "Select for chat" : "Available once processing finishes",
    onchange: (e) => { e.target.checked ? state.selected.add(doc.id) : state.selected.delete(doc.id);
                       renderDocs(); } });
  checkbox.checked = state.selected.has(doc.id);

  const meta = h("div", { class: "doc-meta" }, statusBadge(doc),
    doc.category ? `${doc.category} · ` : null, formatSize(doc.size_bytes),
    doc.page_count ? ` · ${doc.page_count} p` : null);
  const actions = h("div", { class: "doc-actions" },
    ready ? h("button", { class: "icon-btn", title: "View summary & insights",
                          onclick: () => showInsights(doc) }, "ⓘ") : null,
    doc.status === "failed" ? h("button", { class: "icon-btn", title: "Retry processing",
                                            onclick: () => reprocess(doc) }, "↻") : null,
    !isWorking(doc) ? h("button", { class: "icon-btn", title: "Delete",
                                    onclick: () => removeDoc(doc) }, "🗑") : null);

  return h("div", { class: "doc" + (state.selected.has(doc.id) ? " selected" : "") },
    checkbox,
    h("div", {},
      h("div", { class: "doc-name" }, doc.filename), meta,
      doc.error ? h("div", { class: "doc-error" }, doc.error) : null,
      doc.tags.length ? h("div", { class: "tags" }, doc.tags.slice(0, 4).map((t) => h("span", { class: "tag" }, t))) : null),
    actions);
}

async function uploadFiles(files) {
  for (const file of files) {
    const form = new FormData();
    form.append("file", file);
    try {
      const doc = await fetch("/documents", { method: "POST", body: form });
      const body = await doc.json().catch(() => ({}));
      if (!doc.ok) throw new Error(body.detail || `Upload failed (${doc.status})`);
      toast(doc.status === 200 ? `${file.name} was already uploaded` : `Uploaded ${file.name}`);
    } catch (e) { toast(`${file.name}: ${e.message}`, true); }
  }
  await loadDocs();
}

async function reprocess(doc) {
  try { await api(`/documents/${doc.id}/reprocess`, { method: "POST" }); await loadDocs(); }
  catch (e) { toast(e.message, true); }
}

async function removeDoc(doc) {
  if (!confirm(`Delete "${doc.filename}"? Its chat sessions will lose this document.`)) return;
  try { await api(`/documents/${doc.id}`, { method: "DELETE" }); state.selected.delete(doc.id);
        await loadDocs(); }
  catch (e) { toast(e.message, true); }
}

async function showInsights(doc) {
  try {
    const i = await api(`/documents/${doc.id}/insights`);
    const list = (items) => h("ul", {}, items.map((x) => h("li", {}, x)));
    $("insightsBody").replaceChildren(
      h("h3", {}, i.filename),
      h("div", { class: "doc-meta" }, h("span", { class: "badge ready" }, i.category),
        `sentiment: ${i.sentiment}`),
      h("h4", {}, "Summary"), h("p", { style: "margin:0" }, i.summary),
      h("h4", {}, "Key points"), list(i.key_points),
      h("h4", {}, "Topics"), h("div", { class: "tags" }, i.topics.map((t) => h("span", { class: "tag" }, t))),
      h("h4", {}, "Tags"), h("div", { class: "tags" }, i.tags.map((t) => h("span", { class: "tag" }, t))),
      h("div", { class: "dlg-foot" }, h("button", { class: "btn secondary",
                                                    onclick: () => $("insightsDialog").close() }, "Close")));
    $("insightsDialog").showModal();
  } catch (e) { toast(e.message, true); }
}

/* ---------- chat session ---------- */
function updateStartButton() {
  const n = state.selected.size;
  const btn = $("startChat");
  btn.disabled = n === 0;
  btn.textContent = n === 0 ? "Select documents to chat"
    : `Chat with ${n} document${n > 1 ? "s" : ""}`;
}

async function startChat() {
  try {
    const session = await api("/chat/sessions", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ document_ids: [...state.selected] }) });
    setSession(session, []);
  } catch (e) { toast(e.message, true); }
}

function setSession(session, history) {
  state.session = session;
  session ? localStorage.setItem(SESSION_KEY, JSON.stringify(session))
          : localStorage.removeItem(SESSION_KEY);
  const chips = $("chips");
  chips.replaceChildren(...(session
    ? session.documents.map((d) => h("span", { class: "chip" }, d.filename))
    : [h("span", { class: "title" }, "Chat")]));
  $("newChat").hidden = !session;
  const input = $("input");
  input.disabled = !session;
  $("send").disabled = !session;
  input.placeholder = session ? "Ask a question about your documents…" : "Start a chat to ask questions";
  renderThread(history);
  if (session) input.focus();
}

function renderThread(history) {
  const box = $("messages");
  box.replaceChildren();
  if (!state.session) {
    box.append(h("div", { class: "placeholder" }, h("div", { class: "big" }, "💬"),
      h("h2", {}, "Chat with your documents"),
      "Upload documents, wait until they are ready, select one or more, and start a chat. " +
      "Answers come only from your documents, with citations."));
    return;
  }
  const thread = h("div", { class: "thread", id: "thread" });
  box.append(thread);
  if (!history.length) {
    thread.append(h("div", { class: "placeholder" }, h("div", { class: "big" }, "✨"),
      h("h2", {}, "Ask anything"),
      "Follow-up questions work too: the assistant remembers the conversation."));
  }
  history.forEach((m) => appendMessage(m));
  scrollDown(false);
}

function scrollDown(smooth = true) {
  const box = $("messages");
  box.style.scrollBehavior = smooth ? "smooth" : "auto";
  box.scrollTop = box.scrollHeight;
}

/* Escape first, then add only our own tags, so model output can never inject HTML. */
function renderAnswer(text, citedIndexes) {
  const inline = (s) => s
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[(\d+)\]/g, (m, n) => citedIndexes.has(+n) ? `<button class="cite" data-n="${n}">${n}</button>` : m);
  const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let html = "", inList = false;
  for (const line of escaped.split("\n")) {
    const bullet = line.match(/^\s*[-*•]\s+(.*)/);
    if (bullet) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(bullet[1])}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  return html + (inList ? "</ul>" : "");
}

function sourceCard(c) {
  const card = h("div", { class: "source", "data-n": c.index });
  card.append(
    h("button", { class: "source-head", onclick: () => card.classList.toggle("open") },
      h("span", { class: "n" }, c.index), h("span", { class: "file" }, c.filename),
      h("span", { class: "pg" }, `p.${c.page_number} · ${Math.round(c.score * 100)}% match`)),
    h("div", { class: "source-body" }, `“${c.snippet.trim()}…”`));
  return card;
}

function appendMessage(m) {
  const thread = $("thread");
  thread.querySelector(".placeholder")?.remove();
  const el = h("div", { class: `msg ${m.role}` });
  if (m.role === "user") {
    el.append(h("div", { class: "bubble" }, m.content));
  } else {
    const citations = m.citations || [];
    const bubble = h("div", { class: "bubble" });
    bubble.innerHTML = renderAnswer(m.content, new Set(citations.map((c) => c.index)));
    el.append(bubble);
    if (citations.length) {
      el.append(h("div", { class: "sources" }, h("div", { class: "sources-title" }, "Sources"),
        citations.map(sourceCard)));
    }
    if (m.latency_ms) el.append(h("div", { class: "msg-meta" }, `${(m.latency_ms / 1000).toFixed(1)}s`));
  }
  thread.append(el);
  return el;
}

function appendError(message) {
  const el = h("div", { class: "msg assistant" }, h("div", { class: "bubble error" }, message));
  $("thread").append(el);
}

async function sendQuestion() {
  const input = $("input");
  const question = input.value.trim();
  if (!question || state.busy || !state.session) return;
  state.busy = true;
  input.value = "";
  autoGrow();
  $("send").disabled = true;
  appendMessage({ role: "user", content: question });
  const typing = h("div", { class: "msg assistant" },
    h("div", { class: "bubble" }, h("span", { class: "typing" }, h("i"), h("i"), h("i"))));
  $("thread").append(typing);
  scrollDown();
  try {
    const answer = await api(`/chat/sessions/${state.session.id}/messages`, { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
    typing.remove();
    appendMessage(answer);
  } catch (e) {
    typing.remove();
    appendError(e.message);
  } finally {
    state.busy = false;
    $("send").disabled = false;
    input.focus();
    scrollDown();
  }
}

function autoGrow() {
  const input = $("input");
  input.style.height = "auto";
  input.style.height = `${input.scrollHeight}px`;
}

async function restoreSession() {
  const saved = localStorage.getItem(SESSION_KEY);
  if (!saved) return setSession(null, []);
  try {
    const session = JSON.parse(saved);
    const history = await api(`/chat/sessions/${session.id}/messages`);
    setSession(session, history);
  } catch {
    setSession(null, []);  // session no longer exists (e.g. database was reset)
  }
}

/* ---------- wiring ---------- */
$("fileInput").addEventListener("change", (e) => { uploadFiles([...e.target.files]); e.target.value = ""; });
const zone = $("dropzone");
["dragenter", "dragover"].forEach((t) => zone.addEventListener(t, (e) => { e.preventDefault(); zone.classList.add("drag"); }));
["dragleave", "drop"].forEach((t) => zone.addEventListener(t, (e) => { e.preventDefault(); zone.classList.remove("drag"); }));
zone.addEventListener("drop", (e) => uploadFiles([...e.dataTransfer.files]));
$("startChat").addEventListener("click", startChat);
$("newChat").addEventListener("click", () => setSession(null, []));
$("send").addEventListener("click", sendQuestion);
$("input").addEventListener("input", autoGrow);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
});
// One delegated handler: clicking an inline [n] opens and highlights its source card.
$("messages").addEventListener("click", (e) => {
  const cite = e.target.closest(".cite");
  if (!cite) return;
  const card = cite.closest(".msg").querySelector(`.source[data-n="${cite.dataset.n}"]`);
  if (!card) return;
  card.classList.add("open", "flash");
  card.scrollIntoView({ block: "nearest", behavior: "smooth" });
  setTimeout(() => card.classList.remove("flash"), 1200);
});

loadDocs().then(restoreSession);
</script>
