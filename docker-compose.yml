x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://docuai:docuai@db:5432/docuai
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./app:/code/app
    # API writes uploads here and the worker reads them, so both must share it.
    - ./storage:/code/storage
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docuai
      POSTGRES_PASSWORD: docuai
      POSTGRES_DB: docuai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuai"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A app.worker worker --loglevel=info --concurrency=2

volumes:
  pgdata:
